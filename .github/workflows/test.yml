name: Test

on:
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
      - 'CHANGELOG.md'
      - 'website/*'
  push:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
      - 'CHANGELOG.md'
      - 'website/*'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.26'
      id: go

    - name: Check out code into the Go module directory
      uses: actions/checkout@v6

    - name: Run linters
      uses: golangci/golangci-lint-action@v9
      with:
        version: v2.15.0
        args: --timeout 10m

    # tfplugindocs reads the provider schema through the Terraform CLI. Without
    # this step it downloads its own copy on every run.
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v4
      with:
        terraform_wrapper: false

    - name: Generate
      run: make generate

    - name: Confirm no diff
      run: |
        git diff --compact-summary --exit-code || \
          (echo "*** Unexpected differences after code generation. Run 'make generate' and commit."; exit 1)

    - name: Build
      run: make build

  test:
    name: 'Acc. Tests (OS: ${{ matrix.os }} / TF: ${{ matrix.terraform }} / Mimir: ${{ matrix.mimir-version }})'
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
        terraform:
          - '1.5.*'
        # Latest patch of the two newest minors, plus the last minor of the previous major.
        mimir-version:
          - '2.17.12'
          - '3.1.10'
          - '3.2.5'
    steps:

    - name: Setup Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.26'
        check-latest: true

    - name: Check out code
      uses: actions/checkout@v6

    - name: Setup Terraform ${{ matrix.terraform }}
      uses: hashicorp/setup-terraform@v4
      with:
        terraform_version: ${{ matrix.terraform }}
        terraform_wrapper: false

    - name: Setup Grafana Mimir from ${{ matrix.mimir-version }}
      run: |
        docker pull grafana/mimir:${{ matrix.mimir-version }}
        # The runtime config file enables /api/v1/user_limits, which Mimir only
        # serves when -runtime-config.file is set (mimir_tenant_limits tests).
        docker run \
          -d \
          -p 8080:8080 \
          --name mimir \
          -v "${{ github.workspace }}/.github/mimir/runtime.yaml:/etc/mimir/runtime.yaml:ro" \
          grafana/mimir:${{ matrix.mimir-version }} \
          -target=alertmanager,ruler \
          -tenant-federation.enabled=true \
          -ruler.tenant-federation.enabled=true \
          -runtime-config.file=/etc/mimir/runtime.yaml

    - name: Run acceptance test
      run: MIMIR_VERSION=${{ matrix.mimir-version }} make testacc
